<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Js Na</title>
    <style>
        @import url('./resources/css/reset.css');
        @import url('./resources/css/root.css');

        #HelloJs {
            position: fixed;
            left: 0;
            top: 0;
            font-family: "SeoulAlrim", sans-serif;
            font-weight: bold;
            width: 100vw;
            height: 100svh;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: HideHelloJs 1s ease-in-out 4s forwards;
            background-color: var(--PrimaryBackground);
            z-index: 5678;
        }

        #HelloJs h1 {
            font-size: 4rem;
            font-weight: 900;
            color: var(--PrimaryText);
            animation: HelloJsTitle 4s cubic-bezier(0.22, 1, 0.36, 1);
            margin: 0;
        }

        #HelloJs h3 {
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--PrimaryText);
            animation: HelloJsSubtitle 4s cubic-bezier(0.22, 1, 0.36, 1);
            margin: 0;
        }

        #MainJs {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
        }

        #MainJs * {
            font-family: 'Pretendard GOV', sans-serif !important;
        }

        #Name {
            margin-bottom: 2rem;
        }

        #Links {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 0.5em;
        }

        #Links p {
            font-size: 0.8em;
        }

        #Links a {
            margin-left: 0.5rem;
            text-decoration: none;
            color: var(--PrimaryText);
            font-family: 'Pretendard GOV', sans-serif !important;
            font-weight: 500;
        }

        #Links a::after {
            content: '→';
            margin-left: 0.5em;
            opacity: 0.5;
        }

        #Links span:nth-of-type(4n+1) {
            color: var(--SMRT5);
        }

        #Links span:nth-of-type(4n+2) {
            color: var(--SMRT6);
        }

        #Links span:nth-of-type(4n+3) {
            color: var(--SMRT7);
        }

        #Links span:nth-of-type(4n) {
            color: var(--SMRT8);
        }

        #JsNaFixed {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            font-size: 1.8rem;
            font-weight: 200;
            color: var(--PrimaryText);
            opacity: 0.5;
            user-select: none;
        }

        @keyframes HideHelloJs {
            0% {
                opacity: 1;
            }

            75% {
                opacity: 1;
                filter: none;
                -webkit-filter: none;
            }

            95% {
                opacity: 0;
            }

            100% {
                opacity: 0;
                display: none;
            }
        }
    </style>
</head>

<body>
    <div id="HelloJs">
        <div id="HelloContent">
            <h3>Hello, I'm</h3>
            <h1>Js Na</h1>
        </div>
    </div>
    <div id="MainJs">
        <div id="Name">
            <span>Software Developer</span>
            <div>
                <h1>Jisung Na</h1><span>나지성</span>
            </div>
        </div>
        <div id="Links">
            <span>
                <p>Email</p><a href="mailto:open-durable-blend@duck.com">Send Email</a>
            </span>
            <span>
                <p>Instagram</p><a href="https://instagram.com/dev.jsna">@dev.jsna</a>
            </span>
            <span>
                <p>GitHub</p><a href="https://github.com/hellojsna">@hellojsna</a>
            </span>
            <span>
                <p>Homepage</p><a href="https://jsna.dev">https://jsna.dev</a>
            </span>
        </div>
        <h3 id="JsNaFixed">Js Na</h3>
    </div>
</body>

</html>
